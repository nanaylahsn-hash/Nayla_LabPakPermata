<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>LMS</title>
<style>
  * {
    box-sizing: border-box; 
    font-family: Arial, sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url('https://lms.prasetiyamulya.ac.id/pluginfile.php/1/theme_moove/loginbgimg/1787063519/bg_login_mdl.jpg');
    background-size: cover;      
    background-position: center; 
    background-repeat: no-repeat;
  }

  .login-card {
    background: #ffffff;
    width: 800px;
    max-width: 90%;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex; 
    overflow: hidden;
  }

  .login-left {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-right: 1px solid #eee;
  }

  .logo-text {
    font-size: 22px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 24px;
  }

  .logo-text small {
    display: block;
    font-size: 13px;
    font-weight: normal;
    color: #555;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }

  input:focus {
    outline: none;
    border-color: #1e3a8a;
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    background-color: #9ca3af; 
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-login:hover {
    background-color: #6b7280;
  }

  .lost-password {
    text-align: center;
    margin-top: 16px;
  }

  .lost-password a {
    color: #6b7280;
    text-decoration: none;
    font-size: 14px;
  }

  .lost-password a:hover {
    text-decoration: underline;
  }

  .login-right {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #333;
  }

  .login-right p {
    font-size: 16px;
    margin-bottom: 20px;
  }

  .login-right small {
    color: #777;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .login-card {
      flex-direction: column;
    }
    .login-left {
      border-right: none;
      border-bottom: 1px solid #eee;
    }
  }
</style>
</head>
<body>

  <div class="login-card">

    <div class="login-left">
      <div style="text-align:center; margin-bottom:30px;">
        <img src="https://lms.prasetiyamulya.ac.id/pluginfile.php/1/theme_moove/logo/1787063519/logo_upm_biru.png"
             alt="Universitas Prasetiya Mulya" style="width:100%; max-width:300px;">
      </div>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Username or email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-login">Log in</button>
      </form>

      <div class="lost-password">
        <a href="#">Forgot password?</a>
      </div>
    </div>

    <div class="login-right">
      <p>This site best viewed in Google Chrome.</p>
      <small> ? Cookie Notice</small>
    </div>

  </div>

  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function (event) {
      event.preventDefault(); 

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === '' || password === '') {
        alert('Username dan password harus diisi!');
        return;
      }

      alert('Login dicoba dengan username: ' + username);
    });
  </script>

</body>
</html>
